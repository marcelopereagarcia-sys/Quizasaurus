# Publishes the player (a static PWA) on GitHub Pages after every push to main.
# One-time setup in the repository: Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Plays the built app like a child before publishing it (QZS-22): a failed audit stops the deploy.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx tsx scripts/audit.mts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit
          path: |
            docs/gestion/auditoria-o2.md
            audit-output/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
